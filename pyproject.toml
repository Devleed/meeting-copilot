[project]
name = "audio-transcriber"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "openai",
    "anthropic",
    "torch",
    "tiktoken",
    "qdrant-client",
    "pypdf2",
    "python-docx",
    "python-dotenv",
    "rank-bm25",
    "cohere",
    "torchaudio>=2.11.0",
]

[project.scripts]
copilot = "copilot:main"

[tool.uv]
package = true

