[project]
name = "audio-transcriber"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "openai",
    "anthropic",
    "torch",
    "tiktoken",
    "qdrant-client",
    "pypdf",
    "python-docx",
    "python-dotenv",
    "rank-bm25",
    "cohere",
    "torchaudio>=2.11.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "httpx>=0.24.0",
    "scipy>=1.17.1",
]

[project.scripts]
copilot = "copilot:main"
suggest-server = "api.server:start"

[project.optional-dependencies]
pocketstation = ["pocketstation>=0.1.3,<0.2"]

[tool.uv]
package = true
